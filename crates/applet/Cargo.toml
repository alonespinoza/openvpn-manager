[package]
name = "openvpn-manager-applet"
description = "COSMIC panel applet for openvpn3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openvpn-manager-applet"
path = "src/main.rs"

[dependencies]
openvpn3-dbus = { path = "../openvpn3-dbus" }
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned to a known-good revision rather than floating master. libcosmic moves
# fast and this is a single-machine tool; a surprise build break costs more than
# a stale toolkit. Re-pin deliberately when there is a reason to.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "1f8d8786940cc6db59d412153c5a03f69a20375c"
default-features = false
features = ["applet", "tokio", "a11y", "wgpu"]

# XDG portal file chooser for profile import (KTD7).
[dependencies.ashpd]
version = "0.11"
default-features = false
features = ["tokio"]

[package.metadata.deb]
name = "openvpn-manager"
maintainer = "Alonso Espinoza <alonespinoza@users.noreply.github.com>"
copyright = "2026 Alonso Espinoza"
license-file = ["../../LICENSE", "0"]
section = "net"
priority = "optional"

# No Debian revision suffix. cargo-deb defaults to appending -1, which produces
# openvpn-manager_1.0.0-1_amd64.deb. The revision exists to version the
# packaging separately from upstream, and here they are the same thing — so the
# filename should just be the version people are looking for.
revision = ""
extended-description = """\
A COSMIC panel applet for openvpn3. Shows connection state at a glance and \
lets you connect, disconnect, switch profiles, and import a .ovpn from the \
panel menu. Credentials are never stored."""

# Recommends rather than Depends: openvpn3-linux is not in Ubuntu's default
# archive, it comes from OpenVPN's own apt repository. Declaring it as a hard
# dependency would make the package uninstallable on a machine that has not
# added that repo yet, which is worse than installing and saying what is
# missing — which the applet does.
depends = "$auto"
recommends = "openvpn3"

assets = [
    ["../../target/release/openvpn-manager-applet", "usr/bin/", "755"],
    ["../../data/io.github.alonespinoza.OpenvpnManager.desktop", "usr/share/applications/", "644"],
    ["../../data/io.github.alonespinoza.OpenvpnManager.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../data/icons/network-vpn-symbolic.svg", "usr/share/icons/hicolor/scalable/apps/io.github.alonespinoza.OpenvpnManager-symbolic.svg", "644"],
    ["../../README.md", "usr/share/doc/openvpn-manager/", "644"],
]
