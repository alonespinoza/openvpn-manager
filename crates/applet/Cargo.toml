[package]
name = "openvpn-manager-applet"
description = "COSMIC panel applet for openvpn3"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "openvpn-manager-applet"
path = "src/main.rs"

[dependencies]
openvpn3-dbus = { path = "../openvpn3-dbus" }
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pinned to a known-good revision rather than floating master. libcosmic moves
# fast and this is a single-machine tool; a surprise build break costs more than
# a stale toolkit. Re-pin deliberately when there is a reason to.
[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
rev = "1f8d8786940cc6db59d412153c5a03f69a20375c"
default-features = false
features = ["applet", "tokio", "a11y", "wgpu"]

# XDG portal file chooser for profile import (KTD7).
[dependencies.ashpd]
version = "0.11"
default-features = false
features = ["tokio"]
